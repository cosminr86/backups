[gcode_macro PRINT_START]
gcode:
    {% set FILAMENT_TYPE = params.FILAMENT_TYPE|default('GENERIC')|upper %}
    {% set BED_TEMP = params.BED_TEMP|default(0)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(150)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER|default(0)|int %}

    RESPOND MSG="Material: {FILAMENT_TYPE}"
    RESPOND MSG="Bed: {BED_TEMP}C | Nozzle: {EXTRUDER_TEMP}C | Chamber: {CHAMBER_TEMP}C"

    SET_PIN PIN=Daylight VALUE=1.0

    SET_GCODE_OFFSET Z=0 MOVE=0
    SET_SKEW CLEAR=1
    BED_MESH_CLEAR
    G90
    M83

    M140 S{BED_TEMP}

    {% if "ABS" in FILAMENT_TYPE or "ASA" in FILAMENT_TYPE %}
        RESPOND MSG="ABS/ASA detected - smart chamber fans armed"
    {% else %}
        RESPOND MSG="Non ABS/ASA material - chamber fans off"
        STOP_SMART_CHAMBER_FANS
        SET_FAN_SPEED FAN=Nevermore SPEED=0
        SET_FAN_SPEED FAN=Bed_Fans SPEED=0
    {% endif %}

    STATUS_HOMING
    _CG28

    STATUS_HEATING
    M190 S{BED_TEMP}

    {% if "ABS" in FILAMENT_TYPE or "ASA" in FILAMENT_TYPE %}
        RESPOND MSG="Bed reached target - chamber fans ON"
        SET_FAN_SPEED FAN=Nevermore SPEED=1.0
        SET_FAN_SPEED FAN=Bed_Fans SPEED=1.0
        START_SMART_CHAMBER_FANS BED_TARGET={BED_TEMP}
    {% endif %}

    PARK

    {% if ("ABS" in FILAMENT_TYPE or "ASA" in FILAMENT_TYPE) and CHAMBER_TEMP > 0 %}
        RESPOND MSG="Waiting for chamber: {CHAMBER_TEMP}C"
        TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={CHAMBER_TEMP}
    {% endif %}

    M104 S150

    QUAD_GANTRY_LEVEL

    STATUS_MESHING
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE LOAD=default

    G90
    G0 Z10 F3000
    G28 Z

    G0 X50 Y357 F12000
    M109 S{EXTRUDER_TEMP}

    clean_nozzle
    PARK

    {% if "TPU" in FILAMENT_TYPE %}
        SET_GCODE_OFFSET Z_ADJUST=+0.1 MOVE=1
    {% endif %}

    STATUS_PRINTING
    SKEW_PROFILE LOAD=CaliFlower

    {% if "TPU" not in FILAMENT_TYPE %}
        VORON_PURGE
    {% endif %}