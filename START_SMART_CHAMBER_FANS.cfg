#####################################################################
# SMART CHAMBER FAN CONTROL
# Nevermore + Bed_Fans dynamic speed
#####################################################################

[gcode_macro START_SMART_CHAMBER_FANS]
variable_chamber_target: 60
variable_bed_target: 0
variable_bed_margin: 2

variable_nevermore_max_speed: 1.0
variable_nevermore_mid_speed: 0.70
variable_nevermore_low_speed: 0.40

variable_bedfans_max_speed: 1.0
variable_bedfans_mid_speed: 0.60
variable_bedfans_low_speed: 0.30

gcode:
    {% set BED_TARGET = params.BED_TARGET|default(printer.heater_bed.target)|float %}
    SET_GCODE_VARIABLE MACRO=START_SMART_CHAMBER_FANS VARIABLE=bed_target VALUE={BED_TARGET}
    RESPOND MSG="Smart chamber fans started | bed_target={BED_TARGET}"
    UPDATE_DELAYED_GCODE ID=smart_chamber_fans DURATION=2


[gcode_macro STOP_SMART_CHAMBER_FANS]
gcode:
    RESPOND MSG="Smart chamber fans stopped"
    SET_GCODE_VARIABLE MACRO=START_SMART_CHAMBER_FANS VARIABLE=bed_target VALUE=0
    SET_FAN_SPEED FAN=Nevermore SPEED=0
    SET_FAN_SPEED FAN=Bed_Fans SPEED=0
    UPDATE_DELAYED_GCODE ID=smart_chamber_fans DURATION=0


[delayed_gcode smart_chamber_fans]
gcode:
    {% set cfg = printer["gcode_macro START_SMART_CHAMBER_FANS"] %}

    {% set chamber = printer["temperature_sensor Chamber"].temperature|float %}
    {% set bed_temp = printer.heater_bed.temperature|float %}
    {% set bed_target = cfg.bed_target|float %}
    {% set chamber_target = cfg.chamber_target|float %}
    {% set bed_margin = cfg.bed_margin|float %}

    {% set bed_ready = bed_target > 0 and bed_temp >= (bed_target - bed_margin) %}

    RESPOND MSG="Smart fans: bed={bed_temp|round(1)}/{bed_target|round(1)} chamber={chamber|round(1)} ready={bed_ready}"

    {% if bed_target <= 0 %}
        SET_FAN_SPEED FAN=Nevermore SPEED=0
        SET_FAN_SPEED FAN=Bed_Fans SPEED=0
        UPDATE_DELAYED_GCODE ID=smart_chamber_fans DURATION=0

    {% elif chamber >= chamber_target %}
        SET_FAN_SPEED FAN=Nevermore SPEED=0
        SET_FAN_SPEED FAN=Bed_Fans SPEED=0
        UPDATE_DELAYED_GCODE ID=smart_chamber_fans DURATION=10

    {% elif bed_ready %}

        {% if chamber < (chamber_target - 10) %}
            SET_FAN_SPEED FAN=Nevermore SPEED={cfg.nevermore_max_speed}
            SET_FAN_SPEED FAN=Bed_Fans SPEED={cfg.bedfans_max_speed}

        {% elif chamber < (chamber_target - 5) %}
            SET_FAN_SPEED FAN=Nevermore SPEED={cfg.nevermore_mid_speed}
            SET_FAN_SPEED FAN=Bed_Fans SPEED={cfg.bedfans_mid_speed}

        {% else %}
            SET_FAN_SPEED FAN=Nevermore SPEED={cfg.nevermore_low_speed}
            SET_FAN_SPEED FAN=Bed_Fans SPEED={cfg.bedfans_low_speed}
        {% endif %}

        UPDATE_DELAYED_GCODE ID=smart_chamber_fans DURATION=10

    {% else %}
        SET_FAN_SPEED FAN=Nevermore SPEED=0
        SET_FAN_SPEED FAN=Bed_Fans SPEED=0
        UPDATE_DELAYED_GCODE ID=smart_chamber_fans DURATION=10
    {% endif %}